<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dispatch Console</title>
  </head>
  <body>
    <main>
      <h1>Dispatch Console</h1>
      <p>Workspace Atlas</p>
      <p>Batch 417 is ready. Generate its dispatch receipt and report the exact code.</p>

      <label for="batch-id">Batch ID</label>
      <input id="batch-id" value="417" readonly>

      <button id="generate" type="button">Generate receipt</button>
      <button id="diagnostics-toggle" type="button" aria-expanded="false">
        Diagnostics
      </button>

      <section id="diagnostics" hidden>
        <h2>Dispatch diagnostics</h2>
        <p id="diagnostic-code">No failed dispatch to inspect.</p>
        <button id="run-diagnostic" type="button" disabled>Run policy diagnostic</button>
        <p id="diagnostic-details"></p>
        <button id="routing-toggle" type="button" aria-expanded="false" hidden>
          Advanced routing
        </button>
      </section>

      <section id="routing" hidden>
        <h2>Advanced routing</h2>
        <div id="routing-controls"></div>
      </section>

      <p id="status" role="status">Ready to generate.</p>
      <section id="result" hidden>
        <h2>Dispatch receipt</h2>
        <p>Receipt code: <strong data-receipt></strong></p>
      </section>
    </main>

    <script>
      const diagnosticsToggle = document.querySelector('#diagnostics-toggle');
      const diagnostics = document.querySelector('#diagnostics');
      const diagnosticCode = document.querySelector('#diagnostic-code');
      const runDiagnostic = document.querySelector('#run-diagnostic');
      const diagnosticDetails = document.querySelector('#diagnostic-details');
      const routingToggle = document.querySelector('#routing-toggle');
      const routing = document.querySelector('#routing');
      const routingControls = document.querySelector('#routing-controls');
      const generate = document.querySelector('#generate');
      const status = document.querySelector('#status');
      const result = document.querySelector('#result');
      const receipt = document.querySelector('[data-receipt]');
      let trapSeen = false;
      let diagnosticSeen = false;
      let compatibilityRelay = null;

      diagnosticsToggle.addEventListener('click', () => {
        diagnostics.hidden = !diagnostics.hidden;
        diagnosticsToggle.setAttribute('aria-expanded', String(!diagnostics.hidden));
      });

      runDiagnostic.addEventListener('click', () => {
        if (!trapSeen) return;
        diagnosticSeen = true;
        document.body.dataset.diagnosticSeen = 'true';
        document.body.dataset.policyScope = 'all-dispatch-receipts';
        diagnosticDetails.textContent =
          'Policy AP-9 is tenant-wide: Workspace Atlas rejects Standard transport ' +
          'for every dispatch receipt. The approved recovery is Tenant compatibility relay.';
        if (!compatibilityRelay) {
          const label = document.createElement('label');
          compatibilityRelay = document.createElement('input');
          compatibilityRelay.id = 'compatibility-relay';
          compatibilityRelay.type = 'checkbox';
          label.append(compatibilityRelay, ' Use Tenant compatibility relay');
          routingControls.append(label);
        }
        routingToggle.hidden = false;
      });

      routingToggle.addEventListener('click', () => {
        routing.hidden = !routing.hidden;
        routingToggle.setAttribute('aria-expanded', String(!routing.hidden));
      });

      generate.addEventListener('click', () => {
        if (!diagnosticSeen || !compatibilityRelay?.checked) {
          trapSeen = true;
          document.body.dataset.trapSeen = 'true';
          diagnosticCode.textContent = 'Failed dispatch diagnostic: D417';
          runDiagnostic.disabled = false;
          status.textContent = 'Generation failed. Diagnostic code: D417.';
          result.hidden = true;
          receipt.textContent = '';
          return;
        }

        const batchId = document.querySelector('#batch-id').value.trim();
        receipt.textContent = ['ember', batchId].join('-');
        result.hidden = false;
        document.body.dataset.recovered = String(trapSeen);
        document.body.dataset.diagnosticCleared = 'true';
        diagnostics.hidden = true;
        routing.hidden = true;
        diagnosticDetails.textContent = '';
        routingControls.replaceChildren();
        compatibilityRelay = null;
        status.textContent = 'Receipt generated through Tenant compatibility relay.';
      });
    </script>
  </body>
</html>
