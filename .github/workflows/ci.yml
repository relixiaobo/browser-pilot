name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          cache: npm

      - run: npm ci
      - run: npm run validate:skill
      - run: npm run release:check-version
      - run: npm run lint
      - run: npm run test:unit
      - run: npx tsc --noEmit
      - run: npm run test:distribution
      - run: npm run build:standalone:js

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          cache: npm

      - run: npm ci
      - run: npm run test:unit
      - run: npx tsc --noEmit
      - run: npm run test:distribution

  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Run Playwright browser gates
        run: npx playwright test --project core --project compat --project network --reporter=dot,html
      - run: npm run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
