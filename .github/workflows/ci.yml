name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - run: npm ci
      - run: npm run test:unit
      - run: npx tsc --noEmit
      - run: npm run test:distribution
      - run: npm run build:standalone:js
